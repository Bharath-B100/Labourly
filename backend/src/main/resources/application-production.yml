# Opt-in profile only. Existing dev/test defaults are unchanged.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # Apply reviewed migrations in a separate release job, after a verified backup.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
auth:
  google:
    client-id: ${GOOGLE_WEB_CLIENT_ID}
jwt:
  secret: ${JWT_SECRET}
