<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labourly Saved Workers Render</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #EAEFF5;
      width: 480px;
      height: 960px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      margin: 0;
    }
    .iphone-case {
      width: 390px;
      height: 844px;
      background: #E5E7EB;
      border-radius: 50px;
      position: relative;
      box-shadow: 
        0 0 0 4px #26292E,
        0 0 0 9px #16181B,
        0 30px 60px -15px rgba(15, 23, 42, 0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: #000000;
      border-radius: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
    }
    .camera-lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111B27;
      border: 1px solid #1E293B;
    }

    /* Top Bar Header (#FFFFFF) */
    .top-header-bar {
      background: #FFFFFF;
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
      z-index: 50;
    }

    /* Status Bar */
    .status-bar {
      height: 48px;
      padding: 14px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      color: #202326;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Navigation Bar */
    .nav-bar {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #202326;
      font-size: 28px;
      font-weight: 300;
    }
    .screen-title {
      font-size: 20px;
      font-weight: 800;
      color: #202326;
      letter-spacing: -0.3px;
    }

    /* Feed Area (#E5E7EB Background) */
    .feed-area {
      flex: 1;
      padding: 14px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #E5E7EB;
      overflow-y: hidden;
    }

    /* Worker Card (#FFFFFF) */
    .worker-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      gap: 12px;
      position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* Left Square Portrait */
    .portrait-box {
      width: 74px;
      height: 74px;
      border-radius: 14px;
      background: #F1F5F9;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid #E2E8F0;
    }
    .portrait-svg {
      width: 100%;
      height: 100%;
    }

    /* Card Details */
    .card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .info-top {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-right: 32px;
    }

    .worker-name {
      font-size: 16px;
      font-weight: 800;
      color: #202326;
      letter-spacing: -0.2px;
    }

    .trade-rating-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
    }

    .rating-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 800;
      color: #202326;
    }
    .star-icon {
      color: #FFCC25;
      font-size: 13px;
    }

    .trade-label {
      color: #64748B;
      font-weight: 600;
    }

    .info-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .daily-rate {
      font-size: 14.5px;
      font-weight: 800;
      color: #202326;
    }

    .location-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      color: #64748B;
      font-weight: 500;
    }

    /* Filled Safety Yellow Heart Icon in Top-Right */
    .heart-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFCC25;
      cursor: pointer;
    }
    .heart-icon-svg {
      width: 20px;
      height: 20px;
      fill: #FFCC25;
    }

    /* Home Indicator */
    .home-indicator-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 135px;
      height: 4px;
      background: #202326;
      border-radius: 2px;
    }
  </style>
</head>
